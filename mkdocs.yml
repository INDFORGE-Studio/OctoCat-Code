site_name: OCTOCAT-CODE
site_description: Un jeu d'aventure rétro pour apprendre à programmer — le site est le jeu.
site_author: INDFORGE Studio
site_url: https://indforge-studio.github.io/OctoCat-Code/
repo_url: https://github.com/INDFORGE-Studio/OctoCat-Code
repo_name: INDFORGE-Studio/OctoCat-Code
use_directory_urls: true

theme:
  name: material
  custom_dir: overrides
  language: fr
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  font: false          # aucune police externe : tout est auto-hébergé (voir stylesheets/octocat.css)
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
  # NB : ne pas activer `navigation.instant` — chaque niveau instancie son propre canvas KAPLAY.

nav:
  - Jeu: index.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/octocat.css

# Tout est auto-hébergé (KAPLAY compris) : le site fonctionne sans CDN et sous une CSP stricte.
# Ordre important : KAPLAY → persistance → sprites → décor → moteur → scènes et niveaux.
# Chaque script de niveau s'enregistre auprès de window.gameEngine ; le moteur ne monte que
# les <div class="octo-game" data-level="N"> et <div class="octo-scene" data-scene="…"> de la page.
extra_javascript:
  - javascripts/vendor/kaplay-3001.0.19.js
  - javascripts/progress.js
  - javascripts/sprites.js
  - javascripts/scenery.js
  - javascripts/pwa.js
  - javascripts/music.js
  - javascripts/fx.js
  - javascripts/sprites-run.js
  - javascripts/playsim.js
  - javascripts/play.js
  - javascripts/puzzle.js
  - javascripts/engine.js
  - javascripts/hub.js
  - javascripts/level1.js
  - javascripts/level2.js
  - javascripts/level3.js
  - javascripts/level4.js
  - javascripts/level5.js
  - javascripts/level6.js
  - javascripts/level7.js
  - javascripts/level8.js
  - javascripts/level9.js
  - javascripts/level10.js
